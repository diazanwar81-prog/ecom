name: ECOM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Unit tests (core packages)
        run: |
          pnpm --filter @ecom/ops-p0 test
          pnpm --filter @ecom/ops-p2 test
          pnpm --filter @ecom/ops-p3 test
          pnpm --filter @ecom/integrations test
          pnpm --filter @ecom/autonomy test
          pnpm --filter @ecom/runtime test
          pnpm --filter @ecom/scoring test
          pnpm --filter @ecom/rules test
