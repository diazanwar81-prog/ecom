services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom_local_only
      POSTGRES_DB: ecom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom -d ecom"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  workspace:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    working_dir: /workspace
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ecom:ecom_local_only@postgres:5432/ecom?schema=public
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/workspace
      - pnpm_store:/pnpm/store
      - root_node_modules:/workspace/node_modules
      - api_node_modules:/workspace/apps/api/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
      - database_node_modules:/workspace/packages/database/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "tail -f /dev/null"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    working_dir: /workspace
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ecom:ecom_local_only@postgres:5432/ecom?schema=public
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:3000
      API_PORT: 4000
    volumes:
      - .:/workspace
      - pnpm_store:/pnpm/store
      - root_node_modules:/workspace/node_modules
      - api_node_modules:/workspace/apps/api/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
      - database_node_modules:/workspace/packages/database/node_modules
    ports:
      - "4000:4000"
    depends_on:
      workspace:
        condition: service_started
    command: sh -c "pnpm --filter @ecom/api dev"
    profiles: ["app"]

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    working_dir: /workspace
    env_file: .env
    environment:
      API_URL: http://localhost:4000
      WEB_PORT: 3000
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/workspace
      - pnpm_store:/pnpm/store
      - root_node_modules:/workspace/node_modules
      - api_node_modules:/workspace/apps/api/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
      - database_node_modules:/workspace/packages/database/node_modules
    ports:
      - "3000:3000"
    depends_on:
      workspace:
        condition: service_started
    command: sh -c "pnpm --filter @ecom/web dev"
    profiles: ["app"]

volumes:
  postgres_data:
  redis_data:
  pnpm_store:
  root_node_modules:
  api_node_modules:
  web_node_modules:
  database_node_modules:
